<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador GitHub API + MongoDB</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Proyecto GitHub API + MongoDB</h1>
      <p>
        Busca repositorios publicos de GitHub, visualiza resultados y guarda datos en MongoDB.
      </p>
    </header>

    <main>
      <section class="panel">
        <h2>Busqueda de repositorios</h2>
        <form id="searchForm">
          <label for="q">Palabra clave</label>
          <input id="q" name="q" type="text" placeholder="Ejemplo: react" required />

          <label for="language">Lenguaje (opcional)</label>
          <select id="language" name="language">
            <option value="">Todos</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="php">PHP</option>
          </select>

          <label class="checkbox-label" for="save">
            <input id="save" name="save" type="checkbox" checked />
            Guardar resultados en MongoDB
          </label>

          <div class="button-row">
            <button type="submit">Buscar</button>
            <button id="loadSavedBtn" type="button" class="secondary">Ver guardados</button>
          </div>
        </form>
      </section>

      <section id="messageBox" class="message" aria-live="polite"></section>

      <section class="panel">
        <h2>Resultados de GitHub</h2>
        <div id="githubResults" class="cards"></div>
      </section>

      <section class="panel">
        <h2>Repositorios guardados en MongoDB</h2>
        <div id="savedResults" class="cards"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
